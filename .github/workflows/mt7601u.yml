name: Build MT7601U KSU Module

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Dependencies & Clang 12
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libelf-dev python3 zip wget clang-12 lld-12 llvm-12
          sudo ln -sf /usr/bin/clang-12 /usr/bin/clang
          sudo ln -sf /usr/bin/ld.lld-12 /usr/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-12 /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-12 /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-strip-12 /usr/bin/llvm-strip
          sudo ln -sf /usr/bin/llvm-objcopy-12 /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-12 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-readelf-12 /usr/bin/llvm-readelf

      - name: Fetch Exact 5.10.237 Kernel Source
        run: |
          mkdir kernel && cd kernel
          git init
          git remote add origin https://googlesource.com
          git fetch --depth=1 origin d09ef2e980e0
          git checkout FETCH_HEAD

      - name: Configure Kernel & vermagic
        working-directory: kernel
        run: |
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 gki_defconfig
          ./scripts/config --set-str CONFIG_LOCALVERSION "-android12-9-00013-gd09ef2e980e0-ab13968955"
          ./scripts/config --disable CONFIG_LOCALVERSION_AUTO
          ./scripts/config --module CONFIG_CFG80211
          ./scripts/config --module CONFIG_MAC80211
          ./scripts/config --module CONFIG_MT7601U
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Compile Kernel Modules
        working-directory: kernel
        run: |
          make -j$(nproc) ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 modules

      - name: Package Ready KernelSU Module
        run: |
          mkdir -p ksu_module/modules
          mkdir -p ksu_module/system/vendor/firmware
          cp kernel/net/wireless/cfg80211.ko ksu_module/modules/
          cp kernel/net/mac80211/mac80211.ko ksu_module/modules/
          cp kernel/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko ksu_module/modules/
          curl -sL "https://githubusercontent.com" -o ksu_module/system/vendor/firmware/mt7601u.bin
          printf "id=mt7601u_wifi_temp\nname=MT7601U Wi-Fi Driver\nversion=v1.0\nversionCode=1\nauthor=CustomBuilder\ndescription=Kernel modules and firmware for MT7601U (5.10.237)\n" > ksu_module/module.prop
          printf "#!/system/bin/sh\nMODDIR=\${0%%/*}\nsleep 15\ninsmod \$MODDIR/modules/cfg80211.ko\ninsmod \$MODDIR/modules/mac80211.ko\ninsmod \$MODDIR/modules/mt7601u.ko\n" > ksu_module/service.sh
          chmod 755 ksu_module/service.sh
          cd ksu_module
          zip -r ../MT7601U_KSU_Module.zip ./*

      - name: Upload Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MT7601U_KSU_Module
          path: MT7601U_KSU_Module.zip
